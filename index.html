<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Registro de Campo - Suicídio</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0d6efd">
<meta name="apple-mobile-web-app-capable" content="yes">

<script src="jspdf.min.js"></script>

<style>
body{
  font-family:Arial, sans-serif;
  padding:15px;
  background:#f5f5f5;
}
.foto-container{
  margin-top:20px;
}

#fotoPreview{
  display:none;
  width:100%;
  max-height:400px;
  object-fit:contain;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
  background:white;
}

.acoes-foto{
  display:none;
  gap:10px;
  margin-top:10px;
}

.acoes-foto button{
  flex:1;
}

.btn-excluir-foto{
  background:#dc3545;
}

.btn-refazer-foto{
  background:#6c757d;
}
  
h2{
  margin-top:20px;
  background:#0d6efd;
  color:white;
  padding:12px;
  border-radius:6px;
}

label{
  display:block;
  margin-top:12px;
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  padding:10px;
  margin:5px 0;
  box-sizing:border-box;
  border-radius:6px;
  border:1px solid #ccc;
  font-size:16px;
}

textarea{
  min-height:80px;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  background:#0d6efd;
  color:white;
  border:none;
  font-size:16px;
  border-radius:8px;
  cursor:pointer;
}

.btn-limpar{
  background:#6c757d;
}
</style>
</head>

<body>

<h2>Dados Operacionais</h2>

<label>Hora do acionamento</label>
<input id="horaAcionamento" type="time">

<label>Protocolo CIODS</label>
<input id="protocolo" type="text">

<label>Hora da chegada</label>
<input id="horaChegada" type="time">

<label>Hora do fim da perícia</label>
<input id="horaFim" type="time">

<label>Situação temporal</label>
<select id="mesmoDia">
  <option value="">Selecione</option>
  <option>Finalizada no mesmo dia</option>
  <option>Finalizada em data diversa</option>
</select>

<label>Patente do PM</label>
<input id="pmPatente" type="text">

<label>Nome do PM</label>
<input id="pmNome" type="text">

<label>Matrícula do PM</label>
<input id="pmMat" type="text">

<label>Preservação do local</label>
<select id="preservado">
  <option value="">Selecione</option>
  <option>Local preservado</option>
  <option>Local não preservado</option>
</select>

<label>Nome do delegado</label>
<input id="delegado" type="text">

<label>Matrícula do delegado</label>
<input id="matDelegado" type="text">

<label>Circunscrição</label>
<input id="circunscricao" type="text">

<h2>Local</h2>

<label>Data da perícia</label>
<input id="data" type="date">

<label>Endereço</label>
<input id="endereco" type="text">

<label>GPS</label>
<input id="gps" type="text">

<label>Tipo de alvenaria</label>
<input id="alvenaria" type="text">

<label>Tipo de piso</label>
<input id="piso" type="text">

<label>Tipo de telha</label>
<input id="telha" type="text">

<label>Tipo de reboco</label>
<input id="reboco" type="text">

<label>Sala</label>
<input id="salas" type="text">

<label>Quartos</label>
<input id="quartos" type="text">

<label>Corredor</label>
<input id="corredor" type="text">

<label>Cozinha</label>
<input id="cozinha" type="text">

<label>Quintal</label>
<input id="quintal" type="text">

<label>Terraço</label>
<input id="terraco" type="text">

<label>Banheiro</label>
<input id="banheiro" type="text">

<label>Garagem</label>
<input id="garagem" type="text">

<label>Outros cômodos</label>
<input id="outros_comodos" type="text">

<label>Ambiente do cadáver</label>
<input id="ambiente" type="text">

<label>Sinais de luta</label>
<textarea id="luta"></textarea>

<label>Arrombamento</label>
<textarea id="arrombamento"></textarea>

<label>Invasão</label>
<textarea id="invasao"></textarea>

<h2>Dinâmica</h2>

<label>Tipo de suspensão</label>
<select id="suspensao">
  <option value="">Selecione</option>
  <option>Completa</option>
  <option>Incompleta</option>
</select>

<label>Tipo de corda</label>
<input id="corda" type="text">

<label>Suporte utilizado</label>
<input id="suporte" type="text">

<label>Local do nó</label>
<input id="localNo" type="text">

<h2>Vítima</h2>

<label>Nome da vítima</label>
<input id="vitima" type="text">

<label>Sexo</label>
<select id="sexo">
  <option value="">Selecione</option>
  <option>Masculino</option>
  <option>Feminino</option>
  <option>Não identificado</option>
</select>

<label>Tipo de documento</label>
<input id="docTipo" type="text">

<label>Número do documento</label>
<input id="docNumero" type="text">

<label>Altura</label>
<input id="altura" type="text">

<label>Traje</label>
<input id="traje" type="text">

<h2>Medidas</h2>

<label>Altura do nó</label>
<input id="alturaNo" type="text">

<label>Altura da vítima</label>
<input id="alturaVitima" type="text">

<label>Altura do suporte</label>
<input id="alturaSuporte" type="text">

<h2>Registro Fotográfico</h2>

<div class="foto-container">

  <input
    id="fotoInput"
    type="file"
    accept="image/*"
    capture="environment"
    hidden
  >

  <button
    type="button"
    id="btnTirarFoto"
    onclick="abrirCamera()"
  >
    📷 FOTO BIC
  </button>

  <img id="fotoPreview">

  <div id="acoesFoto" class="acoes-foto">

    <button
      type="button"
      class="btn-refazer-foto"
      onclick="refazerFoto()"
    >
      🔄 REFAZER
    </button>

    <button
      type="button"
      class="btn-excluir-foto"
      onclick="excluirFoto()"
    >
      🗑️ EXCLUIR
    </button>

  </div>

</div>

<button type="button" onclick="gerarPDF()">
📄 GERAR PDF
</button>

<button type="button" class="btn-limpar" onclick="limparDados()">
🗑️ LIMPAR DADOS
</button>

<script>
/* =========================
SALVAMENTO AUTOMÁTICO
========================= */

const campos = document.querySelectorAll(
  'input:not([type="file"]), select, textarea'
);

campos.forEach(campo => {
  const valorSalvo = localStorage.getItem(campo.id);

  if(valorSalvo !== null){
    campo.value = valorSalvo;
  }

  campo.addEventListener("input", () => {
    localStorage.setItem(campo.id, campo.value);
  });
});

/* =========================
FOTOGRAFIA
========================= */

const fotoInput = document.getElementById("fotoInput");
const fotoPreview = document.getElementById("fotoPreview");
const btnTirarFoto = document.getElementById("btnTirarFoto");
const acoesFoto = document.getElementById("acoesFoto");

let fotoBase64 = null;

function abrirCamera(){
  fotoInput.value = "";
  fotoInput.click();
}

fotoInput.addEventListener("change", function(){

  const arquivo = this.files[0];

  if(!arquivo){
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event){

    const imagem = new Image();

    imagem.onload = function(){

      const canvas = document.createElement("canvas");

      const tamanhoMaximo = 1600;

      let largura = imagem.width;
      let altura = imagem.height;

      if(largura > altura && largura > tamanhoMaximo){

        altura = altura * tamanhoMaximo / largura;
        largura = tamanhoMaximo;

      }else if(altura > tamanhoMaximo){

        largura = largura * tamanhoMaximo / altura;
        altura = tamanhoMaximo;
      }

      canvas.width = largura;
      canvas.height = altura;

      const ctx = canvas.getContext("2d");

      ctx.drawImage(
        imagem,
        0,
        0,
        largura,
        altura
      );

      /*
      A fotografia é convertida para JPEG
      com qualidade de 85%.
      */

      fotoBase64 = canvas.toDataURL(
        "image/jpeg",
        0.85
      );

      fotoPreview.src = fotoBase64;

      fotoPreview.style.display = "block";
      acoesFoto.style.display = "flex";
      btnTirarFoto.style.display = "none";
    };

    imagem.src = event.target.result;
  };

  reader.readAsDataURL(arquivo);
});


function refazerFoto(){

  fotoInput.value = "";
  fotoInput.click();

}


function excluirFoto(){

  fotoBase64 = null;

  fotoInput.value = "";
  fotoPreview.src = "";

  fotoPreview.style.display = "none";
  acoesFoto.style.display = "none";
  btnTirarFoto.style.display = "block";
}
/* =========================
GERAR PDF DINÂMICO
========================= */

async function gerarPDF(){

  const { jsPDF } = window.jspdf;

  const doc = new jsPDF({
    orientation: "portrait",
    unit: "mm",
    format: "a4"
  });

  let texto = "REGISTRO DE INFORMAÇÕES DE CAMPO - SUICÍDIO\n\n";

  document.querySelectorAll("input, select, textarea").forEach(el => {

    if(el.value){

      let nomeCampo = "";

      if(el.previousElementSibling &&
         el.previousElementSibling.tagName === "LABEL"){

        nomeCampo = el.previousElementSibling.innerText;

      }else{

        nomeCampo = el.id;

      }

      texto += `${nomeCampo}: ${el.value}\n\n`;
    }

  });

  const margem = 15;
  const largura = 180;

  const linhas = doc.splitTextToSize(texto, largura);

  let y = 15;

  doc.setFont("courier");
  doc.setFontSize(11);

  linhas.forEach(linha => {

    if(y > 280){
      doc.addPage();
      y = 15;
    }

    doc.text(linha, margem, y);
    y += 6;

  });

 /* =========================
INSERIR FOTOGRAFIA NO PDF
========================= */

if(fotoBase64){

  doc.addPage();

  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);

  doc.text(
    "REGISTRO FOTOGRÁFICO",
    105,
    15,
    { align:"center" }
  );

  /*
  Descobre as proporções da fotografia
  para não deformá-la no PDF.
  */

  const propriedades =
    doc.getImageProperties(fotoBase64);

  const larguraMaxima = 180;
  const alturaMaxima = 245;

  let larguraFoto = larguraMaxima;

  let alturaFoto =
    propriedades.height *
    larguraFoto /
    propriedades.width;

  if(alturaFoto > alturaMaxima){

    alturaFoto = alturaMaxima;

    larguraFoto =
      propriedades.width *
      alturaFoto /
      propriedades.height;
  }

  const x =
    (210 - larguraFoto) / 2;

  doc.addImage(
    fotoBase64,
    "JPEG",
    x,
    25,
    larguraFoto,
    alturaFoto
  );
}


const data =
  document.getElementById("data").value || "sem_data";

doc.save(`registro_suicidio_${data}.pdf`);
}
/* =========================
LIMPAR DADOS
========================= */

function limparDados(){

  const confirmar = confirm(
    "Tem certeza que deseja apagar todos os dados preenchidos?"
  );

  if(confirmar){

    campos.forEach(campo => {
      localStorage.removeItem(campo.id);
    });

    alert("Dados apagados com sucesso.");

    location.reload();
  }
}

/* =========================
SERVICE WORKER
========================= */

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
